  <!-- Node5 -->
  <rect x="100" y="300" width="360" height="150" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="116" y="326" font-size="14" font-weight="700" fill="#334155">Node5</text>
