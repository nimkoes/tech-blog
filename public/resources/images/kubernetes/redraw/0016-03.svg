  <rect x="24" y="170" width="270" height="50" rx="12" fill="#f97316"/>
  <text x="104" y="191" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Scheduler</text>
  <rect x="49" y="197" width="110" height="18" rx="6" fill="#ffedd5"/>
  <text x="104" y="210" font-size="12" fill="#9a3412" text-anchor="middle">CPU / Memory</text>

  <!-- blocked: plain pod via scheduler, pod naming Node5 directly -->
