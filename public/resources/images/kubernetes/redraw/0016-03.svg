  <text x="250" y="66" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">Toleration / Taint</text>

  <!-- request pods -->
  <g fill="#22c55e">
    <rect x="40" y="84" width="100" height="52" rx="12"/>
    <rect x="190" y="84" width="100" height="52" rx="12"/>
    <rect x="310" y="84" width="120" height="52" rx="12"/>
  </g>
  <g font-size="13" font-weight="700" fill="#fff" text-anchor="middle">
    <text x="90" y="115">Pod</text>
    <text x="240" y="104">Pod</text>
    <text x="370" y="104">Pod</text>
  </g>
  <text x="240" y="125" font-size="12" fill="#dcfce7" text-anchor="middle" font-family="'JetBrains Mono',Menlo,monospace">Node5</text>
  <rect x="320" y="111" width="100" height="18" rx="6" fill="#ffedd5" stroke="#f97316"/>
  <text x="370" y="124" font-size="11" fill="#c2410c" text-anchor="middle" font-family="'JetBrains Mono',Menlo,monospace">Toleration</text>

  <!-- scheduler -->
