    <text x="485" y="80">matchExpressions</text>
  </g>
  <rect x="250" y="92" width="100" height="26" rx="13" fill="#fff"/>
  <text x="300" y="109.5" font-size="12" fill="#15803d" text-anchor="middle" font-family="Menlo,'JetBrains Mono',monospace">type:web</text>
  <rect x="380" y="88" width="210" height="50" rx="8" fill="#dbeafe"/>
  <g font-size="12" fill="#1d4ed8" font-family="Menlo,'JetBrains Mono',monospace">
    <text x="394" y="108">- key: <tspan font-weight="700">ver</tspan></text>
    <text x="408" y="128">operator: <tspan font-weight="700" fill="#c2410c">Exists</tspan></text>
  </g>

  <!-- links -->
  <path d="M420 150V170H140V208" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#ao)"/>
  <path d="M420 170H340V208" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#ao)"/>
  <path d="M110 130V186H100V208" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <path d="M110 186H300V208" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- Pods -->
  <g fill="#22c55e">
