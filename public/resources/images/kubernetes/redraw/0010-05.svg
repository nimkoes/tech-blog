  <rect x="60" y="80" width="100" height="26" rx="13" fill="#fff"/>
  <text x="110" y="97.5" font-size="12" fill="#15803d" text-anchor="middle" font-family="Menlo,'JetBrains Mono',monospace">type:web</text>

  <!-- ReplicaSet -->
  <text x="230" y="24" font-size="12" font-weight="700" fill="#64748b">3-1</text>
