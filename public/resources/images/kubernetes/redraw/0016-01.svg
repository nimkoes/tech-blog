<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="570" viewBox="0 0 1040 570" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#334155"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#22c55e"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#3b82f6"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#8b5cf6"/></marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#ec4899"/></marker>
  </defs>
  <rect width="1040" height="570" rx="16" fill="#f8fafc"/>

  <!-- header -->
  <rect x="300" y="16" width="160" height="28" rx="14" fill="#e2e8f0"/>
  <text x="380" y="35" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Node 선택</text>
  <g font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">
    <text x="190" y="70">NodeName</text>
    <text x="330" y="70">NodeSelector</text>
    <text x="520" y="70">NodeAffinity</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4">
    <path d="M260 54V190"/>
    <path d="M400 54V190"/>
  </g>

  <!-- request pods -->
  <g text-anchor="middle">
    <rect x="24" y="88" width="90" height="50" rx="12" fill="#22c55e"/>
    <text x="69" y="108" font-size="13" font-weight="700" fill="#fff">Pod</text>
    <text x="69" y="128" font-size="12" fill="#dcfce7" font-family="Menlo,monospace">CPU : 30</text>

    <rect x="150" y="88" width="80" height="50" rx="12" fill="#22c55e"/>
    <text x="190" y="108" font-size="13" font-weight="700" fill="#fff">Pod</text>
    <text x="190" y="128" font-size="12" fill="#dcfce7" font-family="Menlo,monospace">Node1</text>

    <rect x="280" y="88" width="100" height="50" rx="12" fill="#22c55e"/>
    <text x="330" y="108" font-size="13" font-weight="700" fill="#fff">Pod</text>
    <text x="330" y="128" font-size="12" fill="#dcfce7" font-family="Menlo,monospace">KR : az-1</text>

    <rect x="420" y="88" width="80" height="50" rx="12" fill="#22c55e"/>
    <text x="460" y="108" font-size="13" font-weight="700" fill="#fff">Pod</text>
    <text x="460" y="128" font-size="12" fill="#dcfce7" font-family="Menlo,monospace">US</text>

    <rect x="540" y="88" width="80" height="50" rx="12" fill="#22c55e"/>
    <text x="580" y="108" font-size="13" font-weight="700" fill="#fff">Pod</text>
    <text x="580" y="128" font-size="12" fill="#dcfce7" font-family="Menlo,monospace">CH</text>
  </g>

  <!-- pods -> scheduler -->
  <path d="M69 138V214" stroke="#22c55e" stroke-width="2" marker-end="url(#ag)"/>
  <path d="M330 138V214" stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)"/>
  <path d="M460 138V214" stroke="#8b5cf6" stroke-width="2" marker-end="url(#ap)"/>
  <path d="M580 138V214" stroke="#ec4899" stroke-width="2" marker-end="url(#ak)"/>

  <!-- scheduler -->
  <rect x="24" y="218" width="992" height="54" rx="12" fill="#f97316"/>
  <text x="760" y="241" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Scheduler</text>
  <rect x="705" y="248" width="110" height="18" rx="6" fill="#ffedd5"/>
  <text x="760" y="261" font-size="12" fill="#9a3412" text-anchor="middle">CPU / Memory</text>

  <!-- scheduler -> nodes -->
  <path d="M140 272V312" stroke="#22c55e" stroke-width="2" marker-end="url(#ag)"/>
  <path d="M330 272V312" stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)"/>
  <path d="M460 272V292H752V312" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#ap)"/>
  <path d="M580 272V282H928V312" fill="none" stroke="#ec4899" stroke-width="2" marker-end="url(#ak)"/>
  <!-- NodeName: bypasses scheduler -->
  <path d="M190 138V312" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- region groups -->
  <rect x="96" y="300" width="544" height="248" rx="14" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="656" y="300" width="368" height="248" rx="14" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- nodes -->
  <g fill="#f1f5f9" stroke="#94a3b8">
    <rect x="112" y="316" width="160" height="216" rx="12"/>
    <rect x="288" y="316" width="160" height="216" rx="12"/>
    <rect x="464" y="316" width="160" height="216" rx="12"/>
    <rect x="672" y="316" width="160" height="216" rx="12"/>
    <rect x="848" y="316" width="160" height="216" rx="12"/>
  </g>
  <g font-size="14" font-weight="700" fill="#334155" text-anchor="middle">
    <text x="192" y="342">Node1</text>
    <text x="368" y="342">Node2</text>
    <text x="544" y="342">Node3</text>
    <text x="752" y="342">Node4</text>
    <text x="928" y="342">Node5</text>
  </g>

  <!-- pods on nodes -->
  <g fill="#22c55e">
    <rect x="124" y="360" width="64" height="50" rx="10"/>
    <rect x="196" y="360" width="64" height="50" rx="10"/>
    <rect x="336" y="360" width="64" height="50" rx="10"/>
    <rect x="512" y="360" width="64" height="50" rx="10"/>
    <rect x="720" y="360" width="64" height="50" rx="10"/>
    <rect x="896" y="360" width="64" height="50" rx="10"/>
  </g>
  <g font-size="13" font-weight="700" fill="#fff" text-anchor="middle">
    <text x="156" y="380">Pod</text>
    <text x="228" y="380">Pod</text>
    <text x="368" y="380">Pod</text>
    <text x="544" y="380">Pod</text>
    <text x="752" y="380">Pod</text>
    <text x="928" y="380">Pod</text>
  </g>
  <g font-size="12" fill="#dcfce7" text-anchor="middle" font-family="Menlo,monospace">
    <text x="156" y="400">30</text>
    <text x="228" y="400">Node1</text>
    <text x="368" y="400">az-1</text>
    <text x="544" y="400">az-2</text>
    <text x="752" y="400">US</text>
    <text x="928" y="400">CH</text>
  </g>

  <!-- row labels -->
  <g font-size="13" font-weight="700" text-anchor="end">
    <text x="88" y="472" fill="#1d4ed8">Label</text>
    <text x="88" y="506" fill="#c2410c">Resource</text>
  </g>

  <!-- node labels -->
  <g fill="#fff" stroke-width="1.5">
    <rect x="132" y="456" width="120" height="22" rx="11" stroke="#3b82f6"/>
    <rect x="308" y="456" width="120" height="22" rx="11" stroke="#3b82f6"/>
    <rect x="484" y="456" width="120" height="22" rx="11" stroke="#3b82f6"/>
    <rect x="692" y="456" width="120" height="22" rx="11" stroke="#8b5cf6"/>
    <rect x="868" y="456" width="120" height="22" rx="11" stroke="#8b5cf6"/>
  </g>
  <g font-size="12" text-anchor="middle" font-family="Menlo,monospace">
    <text x="192" y="471.5" fill="#1d4ed8">KR : az-1</text>
    <text x="368" y="471.5" fill="#1d4ed8">KR : az-1</text>
    <text x="544" y="471.5" fill="#1d4ed8">KR : az-2</text>
    <text x="752" y="471.5" fill="#6d28d9">US : az-1</text>
    <text x="928" y="471.5" fill="#6d28d9">US : az-2</text>
  </g>
  <!-- same label on Node1, Node2 -->
  <rect x="124" y="450" width="312" height="34" rx="8" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- resources -->
  <g fill="#ffedd5">
    <rect x="132" y="492" width="120" height="22" rx="6"/>
    <rect x="308" y="492" width="120" height="22" rx="6"/>
    <rect x="484" y="492" width="120" height="22" rx="6"/>
    <rect x="692" y="492" width="120" height="22" rx="6"/>
    <rect x="868" y="492" width="120" height="22" rx="6"/>
  </g>
  <g font-size="12" fill="#9a3412" text-anchor="middle" font-family="Menlo,monospace">
    <text x="192" y="507.5">CPU : 70</text>
    <text x="368" y="507.5">CPU : 50</text>
    <text x="544" y="507.5">CPU : 30</text>
    <text x="752" y="507.5">CPU : 50</text>
    <text x="928" y="507.5">CPU : 30</text>
  </g>
