<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#64748b"/></marker>
  </defs>
  <rect width="680" height="450" rx="16" fill="#f8fafc"/>

  <!-- note -->
  <rect x="20" y="18" width="210" height="70" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <g font-size="13" fill="#334155">
    <text x="36" y="40" font-weight="700" fill="#0f172a">NodePort 용도</text>
    <text x="36" y="60">· 내부망 시스템 연결</text>
    <text x="36" y="78">· 데모나 임시 연결용</text>
  </g>

  <!-- cluster -->
  <rect x="40" y="100" width="600" height="268" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-dasharray="6 4"/>
  <text x="60" y="126" font-size="15" font-weight="700" fill="#4338ca">Cluster</text>

  <!-- service -->
  <rect x="250" y="140" width="180" height="60" rx="12" fill="#0ea5e9"/>
  <text x="340" y="164" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Service</text>
  <text x="340" y="188" font-size="14" fill="#e0f2fe" text-anchor="middle" font-family="Menlo,monospace">171.96.10.17</text>
  <rect x="310" y="128" width="60" height="22" rx="11" fill="#fff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="340" y="143.5" font-size="12" fill="#0369a1" text-anchor="middle" font-family="Menlo,monospace">:9000</text>
  <text x="250" y="122" font-size="12" font-weight="700" fill="#64748b">2-1</text>

  <!-- node port -> service -->
  <path d="M110 240V170H246" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <path d="M570 240V170H434" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <!-- service -> pods -->
  <path d="M320 200V222H190V248" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <path d="M360 200V222H490V248" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- nodes -->
  <g text-anchor="middle">
    <rect x="80" y="240" width="220" height="100" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
    <rect x="150" y="252" width="80" height="30" rx="8" fill="#22c55e"/>
    <text x="190" y="272" font-size="13" font-weight="700" fill="#fff">Pod</text>
    <text x="190" y="304" font-size="14" font-weight="700" fill="#334155">Node1</text>
    <text x="190" y="322" font-size="12" fill="#475569" font-family="Menlo,monospace">192.168.0.11</text>
    <rect x="152" y="330" width="76" height="22" rx="11" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="190" y="345.5" font-size="12" fill="#334155" font-family="Menlo,monospace">:30000</text>

    <rect x="380" y="240" width="220" height="100" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
    <rect x="450" y="252" width="80" height="30" rx="8" fill="#22c55e"/>
    <text x="490" y="272" font-size="13" font-weight="700" fill="#fff">Pod</text>
    <text x="490" y="304" font-size="14" font-weight="700" fill="#334155">Node2</text>
    <text x="490" y="322" font-size="12" fill="#475569" font-family="Menlo,monospace">192.168.0.12</text>
    <rect x="452" y="330" width="76" height="22" rx="11" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="490" y="345.5" font-size="12" fill="#334155" font-family="Menlo,monospace">:30000</text>
  </g>
  <g font-size="12" font-weight="700" fill="#64748b">
    <text x="80" y="234">1-1</text>
    <text x="380" y="234">1-1'</text>
  </g>

  <!-- external -->
  <rect x="290" y="398" width="100" height="34" rx="17" fill="#fff" stroke="#94a3b8"/>
  <text x="340" y="420" font-size="13" fill="#334155" text-anchor="middle">External</text>
  <path d="M290 410L232 356" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <path d="M390 410L448 356" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="480" y="398" width="176" height="34" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="568" y="420" font-size="13" fill="#334155" text-anchor="middle">모든 Node에 Port 할당</text>
</svg>
