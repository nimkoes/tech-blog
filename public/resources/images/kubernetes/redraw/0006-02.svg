  <path d="M336 238V262H260V302" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <path d="M336 262H412V302" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- pods -->
  <g font-size="14" text-anchor="middle">
    <rect x="180" y="314" width="160" height="62" rx="12" fill="#22c55e"/>
