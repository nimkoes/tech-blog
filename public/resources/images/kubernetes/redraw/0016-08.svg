<svg xmlns="http://www.w3.org/2000/svg" width="500" height="360" viewBox="0 0 500 360" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#64748b"/></marker>
  </defs>
  <rect width="500" height="360" rx="16" fill="#f8fafc"/>
  <text x="24" y="36" font-size="18" font-weight="700" fill="#1d4ed8">required vs preferred</text>

  <!-- step tags -->
  <g font-size="12" font-weight="700" fill="#64748b">
    <text x="40" y="66">1-3</text>
    <text x="270" y="66">1-4</text>
    <text x="250" y="344" text-anchor="middle">1-1</text>
  </g>

  <!-- pods -->
  <g fill="#22c55e">
    <rect x="40" y="72" width="190" height="130" rx="12"/>
    <rect x="270" y="72" width="190" height="130" rx="12"/>
  </g>
  <g text-anchor="middle" fill="#fff" font-weight="700">
    <text x="135" y="93" font-size="13">Pod</text>
    <text x="365" y="93" font-size="13">Pod</text>
    <text x="135" y="116" font-size="15">required</text>
    <text x="365" y="116" font-size="15">preferred</text>
  </g>
  <g font-size="12" fill="#dcfce7" text-anchor="middle">
    <text x="135" y="136">matchExpressions</text>
    <text x="365" y="136">matchExpressions</text>
  </g>
  <g fill="#fff">
    <rect x="54" y="144" width="162" height="46" rx="8"/>
    <rect x="284" y="144" width="162" height="46" rx="8"/>
  </g>
  <g font-size="12" fill="#334155" font-family="Menlo,monospace">
    <text x="66" y="162">key: ch</text>
    <text x="66" y="180">operator: <tspan fill="#c2410c" font-weight="700">Exists</tspan></text>
    <text x="296" y="162">key: ch</text>
    <text x="296" y="180">operator: <tspan fill="#c2410c" font-weight="700">Exists</tspan></text>
  </g>

  <!-- required: no node with key ch -> never scheduled -->
  <path d="M135 202V262" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="135" cy="232" r="12" fill="#fff" stroke="#ef4444" stroke-width="2"/>
  <path d="M129 226l12 12M141 226l-12 12" stroke="#ef4444" stroke-width="2.4" stroke-linecap="round"/>

  <!-- preferred: can go to either node -->
  <path d="M365 202V258" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <path d="M365 232H180V258" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- nodes -->
  <g fill="#f1f5f9" stroke="#94a3b8">
    <rect x="60" y="262" width="150" height="60" rx="12"/>
    <rect x="290" y="262" width="150" height="60" rx="12"/>
  </g>
  <g font-size="14" font-weight="700" fill="#334155" text-anchor="middle">
    <text x="135" y="283">Node1</text>
    <text x="365" y="283">Node2</text>
  </g>
  <g fill="#fff" stroke="#94a3b8" stroke-width="1.5">
    <rect x="90" y="291" width="90" height="22" rx="11"/>
    <rect x="320" y="291" width="90" height="22" rx="11"/>
  </g>
  <g font-size="12" fill="#334155" text-anchor="middle" font-family="Menlo,monospace">
    <text x="135" y="306.5"><tspan font-weight="700">kr</tspan> : az-1</text>
    <text x="365" y="306.5"><tspan font-weight="700">us</tspan> : az-1</text>
  </g>
</svg>
