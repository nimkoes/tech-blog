<svg xmlns="http://www.w3.org/2000/svg" width="600" height="344" viewBox="0 0 600 344" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#64748b"/></marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#fff"/></marker>
  </defs>
  <rect width="600" height="344" rx="16" fill="#f8fafc"/>

  <!-- job -->
  <rect x="20" y="20" width="560" height="190" rx="12" fill="#f97316"/>
  <text x="300" y="46" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Job</text>
  <text x="44" y="78" font-size="14" font-weight="700" fill="#fff">completions : 6</text>

  <!-- 6 pods run in order, 2 at a time -->
  <rect x="44" y="90" width="300" height="104" rx="10" fill="#ffedd5"/>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="58" y="102" width="84" height="34" rx="8" fill="#fff" stroke="#22c55e" stroke-width="2"/><text x="100" y="123.5" fill="#15803d">Pod</text>
    <rect x="58" y="148" width="84" height="34" rx="8" fill="#fff" stroke="#22c55e" stroke-width="2"/><text x="100" y="169.5" fill="#15803d">Pod</text>
    <rect x="152" y="102" width="84" height="34" rx="8" fill="#22c55e"/><text x="194" y="123.5" fill="#fff">Pod</text>
    <rect x="152" y="148" width="84" height="34" rx="8" fill="#22c55e"/><text x="194" y="169.5" fill="#fff">Pod</text>
    <rect x="246" y="102" width="84" height="34" rx="8" fill="#22c55e"/><text x="288" y="123.5" fill="#fff">Pod</text>
    <rect x="246" y="148" width="84" height="34" rx="8" fill="#22c55e"/><text x="288" y="169.5" fill="#fff">Pod</text>
  </g>

  <!-- template / selector -->
  <g font-size="12" font-weight="700" text-anchor="middle">
    <text x="480" y="78" fill="#fff">template</text>
    <rect x="440" y="88" width="80" height="30" rx="8" fill="#fff" stroke="#22c55e" stroke-width="1.5"/>
    <text x="480" y="107.5" fill="#15803d">Pod</text>
    <text x="480" y="152" fill="#ffedd5">selector</text>
    <rect x="440" y="162" width="80" height="22" rx="6" fill="#e2e8f0"/>
  </g>
  <path d="M440 103H396V142H348" fill="none" stroke="#fff" stroke-width="2" marker-end="url(#aw)"/>

  <!-- parallelism -->
  <path d="M100 194V258" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <text x="112" y="240" font-size="14" font-weight="700" fill="#0f172a">parallelism : 2</text>
  <rect x="20" y="262" width="220" height="60" rx="10" fill="#ffedd5"/>
  <g font-size="13" font-weight="700" fill="#fff" text-anchor="middle">
    <rect x="34" y="275" width="90" height="34" rx="8" fill="#22c55e"/><text x="79" y="296.5">Pod</text>
    <rect x="136" y="275" width="90" height="34" rx="8" fill="#22c55e"/><text x="181" y="296.5">Pod</text>
  </g>

  <!-- activeDeadlineSeconds -->
  <text x="300" y="240" font-size="14" font-weight="700" fill="#0f172a">activeDeadlineSeconds : 30</text>
  <rect x="300" y="264" width="80" height="34" rx="10" fill="#f97316"/>
  <text x="340" y="285.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Job</text>
  <path d="M380 281H462" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <path d="M470 258V304" stroke="#ef4444" stroke-width="4"/>
  <text x="470" y="324" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">30 sec</text>
  <rect x="482" y="264" width="80" height="34" rx="10" fill="#fff" stroke="#f97316" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="522" y="285.5" font-size="13" font-weight="700" fill="#c2410c" text-anchor="middle">Job</text>
</svg>
