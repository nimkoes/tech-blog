<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#64748b"/></marker>
    <!-- resource cylinders: empty / half used / full -->
    <symbol id="cE" viewBox="0 0 22 36" preserveAspectRatio="none">
      <path d="M1 5v26a10 4 0 0 0 20 0V5" fill="#fff" stroke="#334155" stroke-width="1.5"/>
      <ellipse cx="11" cy="5" rx="10" ry="4" fill="#fff" stroke="#334155" stroke-width="1.5"/>
    </symbol>
    <symbol id="cH" viewBox="0 0 22 36" preserveAspectRatio="none">
      <path d="M1 5v26a10 4 0 0 0 20 0V5" fill="#fff"/>
      <path d="M1 19v12a10 4 0 0 0 20 0V19a10 4 0 0 1-20 0z" fill="#475569"/>
      <path d="M1 5v26a10 4 0 0 0 20 0V5" fill="none" stroke="#334155" stroke-width="1.5"/>
      <ellipse cx="11" cy="5" rx="10" ry="4" fill="#fff" stroke="#334155" stroke-width="1.5"/>
    </symbol>
    <symbol id="cF" viewBox="0 0 22 36" preserveAspectRatio="none">
      <path d="M1 5v26a10 4 0 0 0 20 0V5" fill="#475569" stroke="#334155" stroke-width="1.5"/>
      <ellipse cx="11" cy="5" rx="10" ry="4" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
    </symbol>
    <!-- warning -->
    <symbol id="w" viewBox="0 0 24 22">
      <path d="M12 1.5L23 20.5H1z" fill="#fee2e2" stroke="#ef4444" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M12 8V14" stroke="#b91c1c" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="12" cy="17.3" r="1.3" fill="#b91c1c"/>
    </symbol>
  </defs>
  <rect width="1000" height="480" rx="16" fill="#f8fafc"/>

  <!-- cluster -->
  <rect x="20" y="20" width="960" height="440" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-dasharray="6 4"/>
  <text x="40" y="46" font-size="15" font-weight="700" fill="#4338ca">Cluster</text>

  <!-- namespaces -->
  <g fill="#fefce8" stroke="#facc15" stroke-dasharray="6 4">
    <rect x="40" y="140" width="260" height="300" rx="14"/>
    <rect x="320" y="140" width="260" height="300" rx="14"/>
    <rect x="600" y="140" width="260" height="300" rx="14"/>
  </g>

  <!-- cluster resources -->
  <g font-size="13" font-weight="700" fill="#0f172a" text-anchor="end">
    <text x="130" y="72">Memory</text>
    <text x="130" y="90">CPU</text>
  </g>
  <use href="#cE" x="140" y="56" width="22" height="36"/>
  <use href="#cE" x="170" y="56" width="22" height="36"/>
  <use href="#cE" x="200" y="56" width="22" height="36"/>
  <use href="#cE" x="230" y="56" width="22" height="36"/>
  <use href="#cE" x="260" y="56" width="22" height="36"/>

  <!-- cluster-level ResourceQuota -->
  <rect x="800" y="36" width="160" height="40" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="812" y="61" font-size="13" font-weight="700" fill="#1d4ed8">ResourceQuota</text>
  <use href="#cF" x="922" y="45" width="14" height="22"/>
  <use href="#cF" x="940" y="45" width="14" height="22"/>

  <!-- resource allocation -->
  <path d="M211 94V116M105 116H710" fill="none" stroke="#64748b" stroke-width="2"/>
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)">
    <path d="M105 116V247"/>
    <path d="M235 116V247"/>
    <path d="M385 116V247"/>
    <path d="M515 116V247"/>
    <path d="M710 116V221"/>
  </g>

  <g font-size="14" font-weight="700" fill="#a16207">
    <text x="56" y="428">Namespace</text>
    <text x="336" y="428">Namespace</text>
    <text x="616" y="428">Namespace</text>
  </g>

  <!-- namespace 1 & 2 pods: each near its quota -->
  <g>
    <use href="#cH" x="94" y="250" width="22" height="36"/><use href="#w" x="54" y="264" width="24" height="22"/>
    <use href="#cH" x="224" y="250" width="22" height="36"/><use href="#w" x="184" y="264" width="24" height="22"/>
    <use href="#cH" x="374" y="250" width="22" height="36"/><use href="#w" x="334" y="264" width="24" height="22"/>
    <use href="#cH" x="504" y="250" width="22" height="36"/><use href="#w" x="464" y="264" width="24" height="22"/>
  </g>
  <g font-size="14" font-weight="700" fill="#fff" text-anchor="middle">
    <rect x="65" y="292" width="80" height="44" rx="12" fill="#22c55e"/><text x="105" y="319">Pod</text>
    <rect x="195" y="292" width="80" height="44" rx="12" fill="#22c55e"/><text x="235" y="319">Pod</text>
    <rect x="345" y="292" width="80" height="44" rx="12" fill="#22c55e"/><text x="385" y="319">Pod</text>
    <rect x="475" y="292" width="80" height="44" rx="12" fill="#22c55e"/><text x="515" y="319">Pod</text>
  </g>

  <!-- ResourceQuota per namespace -->
  <g fill="#dbeafe" stroke="#3b82f6">
    <rect x="56" y="362" width="150" height="36" rx="10"/>
    <rect x="336" y="362" width="170" height="36" rx="10"/>
    <rect x="616" y="362" width="170" height="36" rx="10"/>
  </g>
  <g font-size="13" font-weight="700" fill="#1d4ed8">
    <text x="68" y="385">ResourceQuota</text>
    <text x="348" y="385">ResourceQuota</text>
    <text x="628" y="385">ResourceQuota</text>
  </g>
  <use href="#cF" x="184" y="367" width="16" height="26"/>
  <use href="#cF" x="464" y="367" width="16" height="26"/>
  <use href="#cF" x="484" y="367" width="16" height="26"/>
  <use href="#cF" x="744" y="367" width="16" height="26"/>
  <use href="#cF" x="764" y="367" width="16" height="26"/>

  <!-- namespace 3: one large Pod + LimitRange -->
  <rect x="732" y="152" width="120" height="36" rx="10" fill="#ffedd5" stroke="#f97316"/>
  <text x="744" y="175" font-size="13" font-weight="700" fill="#c2410c">LimitRange</text>
  <use href="#cF" x="828" y="157" width="16" height="26"/>

  <use href="#cF" x="654" y="224" width="22" height="36"/>
  <use href="#cF" x="684" y="224" width="22" height="36"/>
  <use href="#cF" x="714" y="224" width="22" height="36"/>
  <use href="#cF" x="744" y="224" width="22" height="36"/>
  <rect x="630" y="264" width="160" height="84" rx="12" fill="#22c55e"/>
  <text x="710" y="312" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Pod</text>

  <!-- incoming Pods checked by LimitRange -->
  <use href="#cF" x="921" y="184" width="18" height="16"/>
  <rect x="900" y="202" width="60" height="38" rx="10" fill="#22c55e"/>
  <text x="930" y="226" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Pod</text>
  <path d="M900 221H863" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <use href="#cF" x="921" y="286" width="18" height="40"/>
  <rect x="900" y="330" width="60" height="38" rx="10" fill="#22c55e"/>
  <text x="930" y="354" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Pod</text>
  <path d="M900 349H860" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="880" cy="349" r="12" fill="#fff" stroke="#ef4444" stroke-width="2"/>
  <path d="M874 343l12 12M886 343l-12 12" stroke="#ef4444" stroke-width="2.4" stroke-linecap="round"/>
</svg>
