<svg xmlns="http://www.w3.org/2000/svg" width="1044" height="580" viewBox="0 0 1044 580" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#64748b"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#3b82f6"/></marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#ec4899"/></marker>
  </defs>
  <rect width="1044" height="580" rx="16" fill="#f8fafc"/>

  <!-- header -->
  <rect x="580" y="14" width="160" height="28" rx="14" fill="#e2e8f0"/>
  <text x="660" y="33" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Pod간 집중/분산</text>
  <g font-size="14" font-weight="700" fill="#1d4ed8">
    <text x="648" y="66" text-anchor="end">Pod Affinity</text>
    <text x="672" y="66">Anti-Affinity</text>
  </g>
  <path d="M660 52V216" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>

