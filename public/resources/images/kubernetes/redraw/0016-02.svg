  <path d="M604 210V324H544V374" fill="none" stroke="#ec4899" stroke-width="2" marker-end="url(#ak)"/>
  <path d="M808 210V330H772V374" fill="none" stroke="#ec4899" stroke-width="2" marker-end="url(#ak)"/>

