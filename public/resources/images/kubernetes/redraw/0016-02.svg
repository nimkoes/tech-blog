  <path d="M512 300V336" stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)"/>
  <path d="M716 300V314H620V336" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)"/>

