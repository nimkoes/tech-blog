  <g fill="#22c55e">
    <rect x="108" y="378" width="72" height="46" rx="10"/>
    <rect x="188" y="378" width="72" height="46" rx="10"/>
    <rect x="336" y="378" width="72" height="46" rx="10"/>
    <rect x="480" y="378" width="78" height="46" rx="10"/>
    <rect x="566" y="378" width="74" height="46" rx="10"/>
    <rect x="480" y="432" width="78" height="46" rx="10"/>
    <rect x="709" y="378" width="78" height="46" rx="10"/>
  </g>
  <g font-size="13" font-weight="700" fill="#fff" text-anchor="middle">
    <text x="144" y="397">Pod</text>
    <text x="224" y="397">Pod</text>
    <text x="372" y="397">Pod</text>
    <text x="519" y="397">Web</text>
    <text x="603" y="406">Server</text>
    <text x="519" y="451">Master</text>
    <text x="748" y="406">Slave</text>
  </g>
  <g font-size="11" fill="#dcfce7" text-anchor="middle" font-family="Menlo,monospace">
    <text x="144" y="415">30</text>
    <text x="224" y="415">Node1</text>
    <text x="372" y="415">az-1</text>
    <text x="519" y="415">Type:Web</text>
    <text x="519" y="469">Type:Master</text>
  </g>
  <rect x="566" y="440" width="74" height="30" rx="8" fill="#8b5cf6"/>
  <text x="603" y="460" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">PV</text>

