  <rect x="508" y="80" width="100" height="46" rx="12" fill="#8b5cf6"/>
  <text x="558" y="99" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">PV</text>
  <text x="558" y="117" font-size="12" fill="#ede9fe" text-anchor="middle" font-family="Menlo,monospace">Hostpath</text>
  <path d="M512 160V143H548V130" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <path d="M604 160V143H568V130" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- request pods -->
  <g fill="#22c55e">
    <rect x="470" y="160" width="84" height="50" rx="12"/>
    <rect x="562" y="160" width="84" height="50" rx="12"/>
    <rect x="674" y="160" width="84" height="50" rx="12"/>
    <rect x="766" y="160" width="84" height="50" rx="12"/>
  </g>
  <g font-size="13" font-weight="700" fill="#fff" text-anchor="middle">
    <text x="512" y="180">Web</text>
    <text x="604" y="180">Server</text>
    <text x="716" y="180">Master</text>
    <text x="808" y="180">Slave</text>
  </g>
  <g font-size="11" fill="#dcfce7" text-anchor="middle" font-family="Menlo,monospace">
