    <rect x="312" y="525" width="120" height="22" rx="6"/>
    <rect x="500" y="525" width="120" height="22" rx="6"/>
    <rect x="688" y="525" width="120" height="22" rx="6"/>
  </g>
  <g font-size="12" fill="#9a3412" text-anchor="middle" font-family="Menlo,monospace">
    <text x="184" y="540.5">CPU : 70</text>
    <text x="372" y="540.5">CPU : 50</text>
    <text x="560" y="540.5">CPU : 30</text>
    <text x="748" y="540.5">CPU : 40</text>
