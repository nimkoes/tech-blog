<svg xmlns="http://www.w3.org/2000/svg" width="680" height="260" viewBox="0 0 680 260" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#64748b"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#3b82f6"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#f97316"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#8b5cf6"/></marker>
  </defs>
  <rect width="680" height="260" rx="16" fill="#f8fafc"/>

  <!-- type headers -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="285" y="20" width="110" height="26" rx="13" fill="#dbeafe"/><text x="340" y="38" fill="#1d4ed8">ClusterIP</text>
    <rect x="415" y="20" width="110" height="26" rx="13" fill="#ffedd5"/><text x="470" y="38" fill="#c2410c">NodePort</text>
    <rect x="540" y="20" width="120" height="26" rx="13" fill="#ede9fe"/><text x="600" y="38" fill="#6d28d9">LoadBalancer</text>
  </g>

  <!-- Admin: person + laptop -->
  <g fill="#334155">
    <circle cx="340" cy="66" r="10"/>
    <path d="M318 104a22 20 0 0 1 44 0z"/>
    <rect x="324" y="92" width="32" height="20" rx="3" fill="#0f172a"/>
    <text x="340" y="106" font-size="9" fill="#fff" text-anchor="middle" font-family="Menlo,monospace">&lt;/&gt;</text>
  </g>
  <!-- Internal user: presenter + board -->
  <g fill="#334155" stroke-linecap="round">
    <rect x="466" y="58" width="44" height="32" rx="3" fill="#fff" stroke="#334155" stroke-width="2.5"/>
    <circle cx="446" cy="80" r="8"/>
    <path d="M432 112a14 16 0 0 1 28 0z"/>
    <path d="M454 94L474 80" stroke="#334155" stroke-width="3"/>
  </g>
  <!-- Cloud provider -->
  <path d="M582 100h40a14 14 0 0 0 0-28a20 20 0 0 0-38-6a15 15 0 0 0-2 34z" fill="#334155"/>
  <text x="600" y="116" font-size="11" fill="#64748b" text-anchor="middle">GCP · AWS · Azure</text>

  <g font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">
    <text x="340" y="136">Admin</text>
    <text x="470" y="136">Internal User</text>
    <text x="600" y="136">Cloud Provider</text>
  </g>

  <!-- flows into service -->
  <path d="M340 144V184H274" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)"/>
  <path d="M470 144V204H274" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#ao)"/>
  <path d="M600 144V224H274" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#ap)"/>

  <!-- service / pod -->
  <rect x="150" y="168" width="120" height="68" rx="12" fill="#0ea5e9"/>
  <text x="210" y="208" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Service</text>
  <path d="M150 202H122" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="24" y="176" width="96" height="52" rx="12" fill="#22c55e"/>
  <text x="72" y="208" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Pod</text>
</svg>
