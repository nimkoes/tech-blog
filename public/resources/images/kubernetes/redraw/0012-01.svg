<svg xmlns="http://www.w3.org/2000/svg" width="680" height="452" viewBox="0 0 680 452" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#3b82f6"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#f97316"/></marker>
    <g id="cyl" stroke-width="1.2"><path d="M0 4v20a9 4 0 0 0 18 0V4"/><ellipse cx="9" cy="4" rx="9" ry="4"/></g>
  </defs>
  <rect width="680" height="452" rx="16" fill="#f8fafc"/>

  <!-- nodes -->
  <g font-size="14" font-weight="700" fill="#334155" text-anchor="middle">
    <rect x="200" y="20" width="280" height="160" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="340" y="42">Node1</text>
    <rect x="200" y="196" width="280" height="120" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="340" y="218">Node2</text>
    <rect x="200" y="332" width="280" height="100" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="340" y="354">Node3</text>
  </g>

  <!-- pods -->
  <g font-size="13" font-weight="700" fill="#fff" text-anchor="middle">
    <rect x="220" y="52" width="90" height="32" rx="8" fill="#22c55e"/><text x="265" y="72.5">Pod</text>
    <rect x="220" y="94" width="90" height="32" rx="8" fill="#22c55e"/><text x="265" y="114.5">Pod</text>
    <rect x="370" y="72" width="90" height="32" rx="8" fill="#22c55e"/><text x="415" y="92.5">Pod</text>
    <rect x="220" y="230" width="90" height="32" rx="8" fill="#22c55e"/><text x="265" y="250.5">Pod</text>
    <rect x="370" y="230" width="90" height="32" rx="8" fill="#22c55e"/><text x="415" y="250.5">Pod</text>
    <rect x="370" y="364" width="90" height="32" rx="8" fill="#22c55e"/><text x="415" y="384.5">Pod</text>
  </g>

  <!-- remaining resources per node -->
  <g fill="#64748b" stroke="#fff">
    <use href="#cyl" x="220" y="140"/><use href="#cyl" x="244" y="140"/><use href="#cyl" x="268" y="140"/><use href="#cyl" x="292" y="140"/><use href="#cyl" x="316" y="140"/>
    <use href="#cyl" x="220" y="276"/><use href="#cyl" x="244" y="276"/><use href="#cyl" x="268" y="276"/>
    <use href="#cyl" x="220" y="400"/>
  </g>

  <!-- controllers -->
  <g font-size="14" font-weight="700" fill="#fff" text-anchor="middle">
    <rect x="24" y="200" width="130" height="50" rx="12" fill="#f97316"/><text x="89" y="230">ReplicaSet</text>
    <rect x="526" y="200" width="130" height="50" rx="12" fill="#f97316"/><text x="591" y="230">DaemonSet</text>
  </g>

  <!-- ReplicaSet: placed by scheduler -->
  <path d="M154 218L216 70" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)"/>
  <path d="M154 222L216 110" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)"/>
  <path d="M154 232L216 246" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)"/>
  <!-- DaemonSet: one per node -->
  <path d="M526 218L464 90" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#ao)"/>
  <path d="M526 230L464 246" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#ao)"/>
  <path d="M526 240L464 378" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#ao)"/>
</svg>
