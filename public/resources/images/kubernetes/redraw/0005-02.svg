<svg xmlns="http://www.w3.org/2000/svg" width="680" height="372" viewBox="0 0 680 372" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#64748b"/></marker>
  </defs>
  <rect width="680" height="372" rx="16" fill="#f8fafc"/>

  <!-- cluster -->
  <rect x="20" y="20" width="640" height="284" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-dasharray="6 4"/>
  <text x="340" y="48" font-size="15" font-weight="700" text-anchor="middle" fill="#4338ca">Kubernetes Cluster</text>

  <!-- pod -->
  <text x="80" y="76" font-size="12" font-weight="700" fill="#64748b">1-1</text>
  <rect x="80" y="82" width="520" height="196" rx="12" fill="#22c55e"/>
  <text x="100" y="106" font-size="15" font-weight="700" fill="#fff">Pod</text>

  <!-- callout localhost -->
  <path d="M470 112V122" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="405" y="88" width="130" height="24" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="470" y="104.5" font-size="12" text-anchor="middle" fill="#334155" font-family="Menlo,'JetBrains Mono',monospace">localhost:8080</text>

  <!-- containers -->
  <rect x="120" y="122" width="170" height="64" rx="10" fill="#fff" stroke="#22c55e"/>
  <text x="205" y="146" font-size="14" font-weight="700" text-anchor="middle" fill="#15803d">Container1</text>
  <rect x="177" y="156" width="56" height="22" rx="11" fill="#fff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="205" y="171.5" font-size="12" text-anchor="middle" fill="#15803d" font-family="Menlo,'JetBrains Mono',monospace">8000</text>

  <rect x="370" y="122" width="200" height="64" rx="10" fill="#fff" stroke="#22c55e"/>
  <text x="470" y="146" font-size="14" font-weight="700" text-anchor="middle" fill="#15803d">Container2</text>
  <rect x="404" y="156" width="56" height="22" rx="11" fill="#fff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="432" y="171.5" font-size="12" text-anchor="middle" fill="#15803d" font-family="Menlo,'JetBrains Mono',monospace">8080</text>
  <rect x="476" y="156" width="56" height="22" rx="11" fill="#fff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="504" y="171.5" font-size="12" text-anchor="middle" fill="#15803d" font-family="Menlo,'JetBrains Mono',monospace">8000</text>
  <path d="M540 159l16 16M556 159l-16 16" stroke="#ef4444" stroke-width="2.4" stroke-linecap="round"/>

  <!-- container1 -> container2:8080 -->
  <path d="M290 167H330V206H432V180" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- port conflict -->
  <path d="M548 214V180" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="506" y="214" width="84" height="28" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="548" y="233" font-size="13" text-anchor="middle" fill="#b91c1c" font-weight="700">Port 충돌</text>

  <!-- pod ip -->
  <rect x="150" y="236" width="130" height="28" rx="14" fill="#fff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="215" y="255" font-size="14" font-weight="700" text-anchor="middle" fill="#15803d" font-family="Menlo,'JetBrains Mono',monospace">10.16.36.22</text>
  <path d="M280 250H300" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="300" y="230" width="150" height="42" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="314" y="247" font-size="12" fill="#334155">IP 자동할당</text>
  <text x="314" y="264" font-size="12" fill="#334155">재생성시 변경</text>

  <!-- internal access -->
  <path d="M34 250H148" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- external blocked -->
  <path d="M215 320V264" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="215" cy="292" r="12" fill="#fff" stroke="#ef4444" stroke-width="2"/>
  <path d="M209 286l12 12M221 286l-12 12" stroke="#ef4444" stroke-width="2.4" stroke-linecap="round"/>
  <rect x="165" y="320" width="100" height="32" rx="16" fill="#fff" stroke="#94a3b8"/>
  <text x="215" y="341" font-size="13" text-anchor="middle" fill="#334155">External</text>
</svg>
